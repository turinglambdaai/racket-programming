name: Refresh dependency lock

on:
  push:
    branches:
      - chore/complete-book-qa

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/complete-book-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lock and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-lock.yml
          git commit -m "Refresh dependency lockfile"
          git push origin HEAD:chore/complete-book-qa

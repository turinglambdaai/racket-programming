<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <title>闭包：函数带着出生时的环境</title>
  <desc>以 make-adder 为例展示闭包：调用 (make-adder 10) 建起环境 n=10，内层 lambda 出生时把该环境捕获带走；日后 (add10 5) 调用时，函数体 (+ x n) 既能看见参数 x=5，也能看见随身的 n=10。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="580" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="520" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">闭包：函数 = 动作 + 出生时的环境</text>
  <line x1="490" y1="56" x2="550" y2="56" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
  <text x="520" y="78" text-anchor="middle" font-size="12" fill="#6a6a6a">make-adder 调用时建环境 n=10，内层函数把它"打包"带走</text>

  <!-- ===== 阶段一：调用 make-adder，环境诞生 ===== -->
  <text x="80" y="120" font-size="13" font-weight="700" fill="#1a1a1a">① 调用 (make-adder 10)</text>
  <text x="80" y="138" font-size="10" fill="#6a6a6a">为这次调用建一个新环境，n 绑定到 10</text>

  <!-- make-adder 的环境框 -->
  <g>
    <rect x="80" y="155" width="200" height="110" rx="10" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="100" y="178" font-size="11" font-weight="600" fill="#2a2a2a" letter-spacing="1">环境 · make-adder 的本次调用</text>
    <line x1="100" y1="188" x2="260" y2="188" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="100" y="212" font-size="12" fill="#1a1a1a">n =</text>
    <text x="150" y="212" font-size="14" font-weight="700" fill="#d97757">10</text>
    <text x="100" y="240" font-size="10" fill="#6a6a6a">函数体在这里求值：</text>
    <text x="100" y="256" font-size="11" font-family="monospace" fill="#1a1a1a">(lambda (x) (+ x n))</text>
  </g>

  <!-- 箭头：lambda 出生 → 把环境捕获 -->
  <path d="M 290 210 L 360 210" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <text x="325" y="200" text-anchor="middle" font-size="10" fill="#d97757">出生</text>

  <!-- ===== 阶段二：闭包形成（动作 + 环境） ===== -->
  <text x="375" y="120" font-size="13" font-weight="700" fill="#1a1a1a">② 返回一个闭包 → add10</text>
  <text x="375" y="138" font-size="10" fill="#6a6a6a">动作 + 当时的环境，一起被带走</text>

  <!-- 闭包框（含两部分） -->
  <g>
    <rect x="370" y="155" width="280" height="110" rx="10" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="510" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a" letter-spacing="1">CLOSURE · add10</text>
    <line x1="390" y1="188" x2="630" y2="188" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- 左：动作 -->
    <text x="395" y="208" font-size="10" fill="#6a6a6a">动作</text>
    <text x="395" y="228" font-size="11" font-family="monospace" fill="#1a1a1a">(λ (x)</text>
    <text x="395" y="246" font-size="11" font-family="monospace" fill="#1a1a1a">   (+ x n))</text>

    <!-- 分隔 -->
    <line x1="490" y1="195" x2="490" y2="255" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- 右：捕获的环境 -->
    <text x="510" y="208" font-size="10" fill="#6a6a6a">捕获的环境</text>
    <text x="510" y="228" font-size="12" fill="#1a1a1a">n =</text>
    <text x="555" y="228" font-size="14" font-weight="700" fill="#d97757">10</text>
    <text x="510" y="248" font-size="9" fill="#6a6a6a">出生时记下的</text>
  </g>

  <!-- 箭头：日后调用 -->
  <path d="M 660 210 L 730 210" fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="200" text-anchor="middle" font-size="10" fill="#6a6a6a">日后调用</text>

  <!-- ===== 阶段三：调用 add10 5，环境合体 ===== -->
  <text x="745" y="120" font-size="13" font-weight="700" fill="#1a1a1a">③ 调用 (add10 5)</text>
  <text x="745" y="138" font-size="10" fill="#6a6a6a">参数 x=5 进来，与随身的 n=10 汇合</text>

  <!-- 调用时的求值框 -->
  <g>
    <rect x="740" y="155" width="240" height="110" rx="10" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="760" y="178" font-size="11" font-weight="600" fill="#2a2a2a" letter-spacing="1">本次调用的求值环境</text>
    <line x1="760" y1="188" x2="960" y2="188" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="760" y="212" font-size="12" fill="#1a1a1a">x =</text>
    <text x="800" y="212" font-size="14" font-weight="700" fill="#d97757">5</text>
    <text x="845" y="212" font-size="10" fill="#6a6a6a">（本次参数）</text>
    <text x="760" y="238" font-size="12" fill="#1a1a1a">n =</text>
    <text x="800" y="238" font-size="14" font-weight="700" fill="#d97757">10</text>
    <text x="845" y="238" font-size="10" fill="#6a6a6a">（闭包随身带的）</text>
    <text x="760" y="258" font-size="10" fill="#6a6a6a">→ (+ x n) = (+ 5 10) = 15</text>
  </g>

  <!-- ===== 底部：关键洞察 ===== -->
  <g>
    <rect x="80" y="320" width="900" height="220" rx="10" fill="#f8f6f3" stroke="#4a4a4a" stroke-width="1" stroke-opacity="0.4"/>
    <text x="100" y="348" font-size="13" font-weight="700" fill="#1a1a1a">闭包不神秘，它就是这两样东西打包在一起</text>

    <!-- 两个要点卡片 -->
    <g>
      <rect x="100" y="365" width="420" height="70" rx="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
      <text x="120" y="388" font-size="11" font-weight="600" fill="#2a2a2a">动作</text>
      <text x="120" y="410" font-size="11" fill="#1a1a1a">一段还没执行的代码 ——</text>
      <text x="120" y="426" font-size="11" font-family="monospace" fill="#1a1a1a">(lambda (x) (+ x n))</text>
    </g>
    <g>
      <rect x="540" y="365" width="420" height="70" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
      <text x="560" y="388" font-size="11" font-weight="600" fill="#2a2a2a">出生时的环境</text>
      <text x="560" y="410" font-size="11" fill="#1a1a1a">定义那一刻能看见的所有变量</text>
      <text x="560" y="426" font-size="11" fill="#1a1a1a">（这里就是 n = 10）</text>
    </g>

    <text x="100" y="465" font-size="12" fill="#1a1a1a">函数被当成值传来传去、跨出原本的作用域时，必须把出生时的环境也带上，否则 (+ x n) 里的 n 就找不到着落。</text>
    <text x="100" y="488" font-size="12" font-weight="700" fill="#d97757">所以闭包不是"功能"，而是"动作是值、值要能到处跑"被迫得出的必然结构。</text>
    <text x="100" y="515" font-size="11" fill="#6a6a6a">日后无论 add10 在哪被调用，它手里的 n 始终是出生时的那个 10 —— 这就是词法作用域的底气。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <title>Custodian 层级与级联关闭</title>
  <desc>Racket custodian 的父子层级：关闭 root 时，子 custodian 及其名下的端口、线程逐层级联被回收。</desc>

  <defs>
    <!-- 实线箭头：归属关系（父子 / 资源被托管） -->
    <marker id="arrow-own" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <!-- 橙色箭头：级联关闭方向 -->
    <marker id="arrow-cascade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="920" height="540" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="460" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Custodian 层级树 · 级联关闭</text>
  <line x1="430" y1="56" x2="490" y2="56" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
  <text x="460" y="78" text-anchor="middle" font-size="12" fill="#6a6a6a">关掉 root，下面整条子链跟着塌</text>

  <!-- 图例 -->
  <g transform="translate(640, 100)">
    <line x1="0" y1="8" x2="34" y2="8" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow-own)"/>
    <text x="42" y="12" font-size="10" fill="#6a6a6a">托管关系（谁归谁管）</text>
    <line x1="0" y1="28" x2="34" y2="28" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cascade)"/>
    <text x="42" y="32" font-size="10" fill="#6a6a6a">关闭方向（级联回收）</text>
  </g>

  <!-- ===== Layer 1: root custodian ===== -->
  <g>
    <rect x="360" y="118" width="200" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="460" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a" letter-spacing="1.5">CUSTODIAN</text>
    <text x="460" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">root</text>
  </g>

  <!-- 托管箭头：root -> child_a / child_b -->
  <line x1="430" y1="182" x2="250" y2="232" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow-own)"/>
  <line x1="490" y1="182" x2="670" y2="232" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow-own)"/>

  <!-- ===== Layer 2: child custodians ===== -->
  <g>
    <rect x="150" y="238" width="200" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="250" y="263" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a" letter-spacing="1.5">CUSTODIAN</text>
    <text x="250" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">child-a</text>
  </g>
  <g>
    <rect x="570" y="238" width="200" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="670" y="263" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a" letter-spacing="1.5">CUSTODIAN</text>
    <text x="670" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">child-b</text>
  </g>

  <!-- 托管箭头：child-a -> 它的资源 -->
  <line x1="220" y1="302" x2="120" y2="372" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow-own)"/>
  <line x1="280" y1="302" x2="290" y2="372" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow-own)"/>
  <!-- 托管箭头：child-b -> 它的资源 -->
  <line x1="640" y1="302" x2="610" y2="372" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow-own)"/>
  <line x1="700" y1="302" x2="800" y2="372" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow-own)"/>

  <!-- ===== Layer 3: resources ===== -->
  <!-- child-a 的资源 -->
  <g>
    <rect x="56" y="378" width="128" height="54" rx="8" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="120" y="400" text-anchor="middle" font-size="10" fill="#6a6a6a" letter-spacing="1">TCP 端口</text>
    <text x="120" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">listener</text>
  </g>
  <g>
    <rect x="226" y="378" width="128" height="54" rx="8" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="290" y="400" text-anchor="middle" font-size="10" fill="#6a6a6a" letter-spacing="1">工作线程</text>
    <text x="290" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">thread</text>
  </g>
  <!-- child-b 的资源 -->
  <g>
    <rect x="546" y="378" width="128" height="54" rx="8" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="610" y="400" text-anchor="middle" font-size="10" fill="#6a6a6a" letter-spacing="1">文件句柄</text>
    <text x="610" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">port</text>
  </g>
  <g>
    <rect x="736" y="378" width="128" height="54" rx="8" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="800" y="400" text-anchor="middle" font-size="10" fill="#6a6a6a" letter-spacing="1">定时器</text>
    <text x="800" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">alarm</text>
  </g>

  <!-- ===== 级联关闭箭头（橙色虚线，从 root 触发，向下扫过整条链） ===== -->
  <!-- root -> child-a / child-b（关闭传递） -->
  <path d="M 380 150 C 320 150, 250 180, 252 232" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cascade)"/>
  <path d="M 540 150 C 600 150, 670 180, 668 232" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cascade)"/>
  <!-- child-a -> 它的资源 -->
  <path d="M 180 262 C 150 262, 120 320, 120 372" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cascade)"/>
  <path d="M 320 262 C 350 262, 290 320, 290 372" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cascade)"/>
  <!-- child-b -> 它的资源 -->
  <path d="M 600 262 C 580 262, 610 320, 610 372" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cascade)"/>
  <path d="M 740 262 C 770 262, 800 320, 800 372" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cascade)"/>

  <!-- 触发点标注 -->
  <g transform="translate(360, 108)">
    <circle cx="0" cy="0" r="6" fill="#d97757"/>
    <text x="12" y="4" font-size="11" font-weight="600" fill="#d97757">custodian-shutdown-all root</text>
  </g>

  <!-- 底部说明 -->
  <text x="460" y="498" text-anchor="middle" font-size="12" fill="#1a1a1a">一次调用，三层资源全部回收 —— 不用手动关，也不会泄漏。</text>
  <text x="460" y="518" text-anchor="middle" font-size="10" fill="#6a6a6a">绿色 = custodian 管家 · 米色 = 被托管的资源 · 橙色虚线 = 关闭沿托管链向下传递</text>
</svg>

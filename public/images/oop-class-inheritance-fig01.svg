<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>继承（is-a） vs mixin（套用）</title>
  <desc>类图对比：左侧纵向继承 student% 继承 person%；右侧横向 mixin，logging-mixin applied to person%。</desc>

  <defs>
    <!-- UML inheritance: hollow triangle pointing to parent -->
    <marker id="inherit" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 13,6 0,12" fill="#f8f6f3" stroke="#4a4a4a" stroke-width="1.5" stroke-linejoin="miter"/>
    </marker>
    <!-- Open arrowhead for mixin application (dependency style) -->
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5.5 L0,11" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1120" height="560" fill="#f8f6f3"/>

  <!-- Overall title -->
  <text x="560" y="42" fill="#1a1a1a" font-size="16" font-weight="700" text-anchor="middle">继承（is-a） vs mixin（套用）</text>

  <!-- Group titles -->
  <text x="240" y="90" fill="#d97757" font-size="13" font-weight="700" text-anchor="middle">纵向继承</text>
  <text x="818" y="90" fill="#d97757" font-size="13" font-weight="700" text-anchor="middle">横向 mixin</text>

  <!-- ============ LEFT GROUP: vertical inheritance ============ -->
  <!-- person% (parent) -->
  <g id="left-person">
    <rect x="150" y="130" width="180" height="120" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="240" y="154" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">person%</text>
    <line x1="150" y1="166" x2="330" y2="166" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="240" y="186" fill="#6a6a6a" font-size="8" text-anchor="middle">- name</text>
    <line x1="150" y1="200" x2="330" y2="200" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="240" y="222" fill="#6a6a6a" font-size="8" text-anchor="middle">+ greet()</text>
  </g>

  <!-- inheritance arrow: student (child) -> person (parent), hollow triangle at parent -->
  <line x1="240" y1="400" x2="240" y2="250" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#inherit)"/>

  <!-- student% (child) -->
  <g id="left-student">
    <rect x="150" y="400" width="180" height="120" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="240" y="424" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">student%</text>
    <line x1="150" y1="436" x2="330" y2="436" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="240" y="456" fill="#6a6a6a" font-size="8" text-anchor="middle">- school</text>
    <line x1="150" y1="470" x2="330" y2="470" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="240" y="492" fill="#6a6a6a" font-size="8" text-anchor="middle">+ study()</text>
  </g>

  <!-- ============ RIGHT GROUP: horizontal mixin ============ -->
  <!-- person% (base class being extended) -->
  <g id="right-person">
    <rect x="605" y="290" width="165" height="120" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="687.5" y="314" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">person%</text>
    <line x1="605" y1="326" x2="770" y2="326" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="687.5" y="346" fill="#6a6a6a" font-size="8" text-anchor="middle">- name</text>
    <line x1="605" y1="360" x2="770" y2="360" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="687.5" y="384" fill="#6a6a6a" font-size="8" text-anchor="middle">+ greet()</text>
  </g>

  <!-- mixin application: dashed arrow logging-mixin -> person%, labeled "applied to" -->
  <line x1="830" y1="350" x2="770" y2="350" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="800" y="340" fill="#6a6a6a" font-size="8" text-anchor="middle">applied to</text>

  <!-- logging-mixin -->
  <g id="right-mixin">
    <rect x="830" y="290" width="200" height="120" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="930" y="314" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">logging-mixin</text>
    <line x1="830" y1="326" x2="1030" y2="326" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="930" y="346" fill="#6a6a6a" font-size="8" text-anchor="middle">- level</text>
    <line x1="830" y1="360" x2="1030" y2="360" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="930" y="380" fill="#6a6a6a" font-size="8" text-anchor="middle">+ log(msg)</text>
    <text x="930" y="396" fill="#6a6a6a" font-size="8" text-anchor="middle">+ wrap(fn)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <title>Racket 数据：原子与复合</title>
  <desc>Racket 数据的两大分类树：原子（数/字符串/布尔/符号/字符）不可再拆，复合（pair/list）把原子粘起来，最终都是 S-表达式。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="560" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="520" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Racket 数据：原子 vs 复合</text>
  <line x1="490" y1="56" x2="550" y2="56" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
  <text x="520" y="78" text-anchor="middle" font-size="12" fill="#6a6a6a">要么不可拆（原子），要么是原子粘起来的（复合）—— 抓牢这条主线</text>

  <!-- ===== 根：Racket 数据 ===== -->
  <g>
    <rect x="430" y="110" width="180" height="56" rx="12" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="520" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#f8f6f3" letter-spacing="1.5">根</text>
    <text x="520" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#f8f6f3">S-表达式</text>
  </g>

  <!-- 根 -> 两大分支 -->
  <path d="M 490 166 L 380 166 L 380 220" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 550 166 L 760 166 L 760 220" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="195" text-anchor="middle" font-size="10" fill="#6a6a6a">不可再拆</text>
  <text x="795" y="195" text-anchor="middle" font-size="10" fill="#6a6a6a">原子粘起来</text>

  <!-- ===== 左分支：原子 ===== -->
  <g>
    <rect x="290" y="226" width="180" height="56" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="380" y="251" text-anchor="middle" font-size="11" fill="#6a6a6a" letter-spacing="1.5">原子 ATOM</text>
    <text x="380" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">car 拆不动</text>
  </g>

  <!-- 原子的 5 个叶子 -->
  <path d="M 380 282 L 380 312 M 100 312 L 660 312" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="100" y1="312" x2="100" y2="346" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="312" x2="240" y2="346" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="312" x2="380" y2="346" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="312" x2="520" y2="346" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="312" x2="660" y2="346" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="352" width="120" height="64" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="100" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">数 number?</text>
    <text x="100" y="392" text-anchor="middle" font-size="9" fill="#6a6a6a">42 · 1/2 · 3.14</text>
    <text x="100" y="406" text-anchor="middle" font-size="9" fill="#6a6a6a">3+4i</text>
  </g>
  <g>
    <rect x="180" y="352" width="120" height="64" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="240" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">字符串 string?</text>
    <text x="240" y="395" text-anchor="middle" font-size="10" fill="#6a6a6a">"hello"</text>
  </g>
  <g>
    <rect x="320" y="352" width="120" height="64" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="380" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">布尔 boolean?</text>
    <text x="380" y="395" text-anchor="middle" font-size="10" fill="#6a6a6a">#t · #f</text>
  </g>
  <g>
    <rect x="460" y="352" width="120" height="64" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="520" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">符号 symbol?</text>
    <text x="520" y="395" text-anchor="middle" font-size="10" fill="#6a6a6a">'foo · 'red</text>
  </g>
  <g>
    <rect x="600" y="352" width="120" height="64" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="660" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">字符 char?</text>
    <text x="660" y="395" text-anchor="middle" font-size="10" fill="#6a6a6a">#\a · #\space</text>
  </g>

  <!-- ===== 右分支：复合 ===== -->
  <g>
    <rect x="670" y="226" width="180" height="56" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="760" y="251" text-anchor="middle" font-size="11" fill="#6a6a6a" letter-spacing="1.5">复合 COMPOUND</text>
    <text x="760" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">能拆 / 能粘</text>
  </g>

  <!-- 复合的两个叶子 -->
  <path d="M 760 282 L 760 312 M 700 312 L 820 312" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="700" y1="312" x2="700" y2="346" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="312" x2="820" y2="346" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="620" y="352" width="160" height="64" rx="8" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="700" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">pair pair?</text>
    <text x="700" y="392" text-anchor="middle" font-size="9" fill="#6a6a6a">cons 造 · car/cdr 拆</text>
    <text x="700" y="406" text-anchor="middle" font-size="9" fill="#6a6a6a">'(1 . 2)</text>
  </g>
  <g>
    <rect x="740" y="352" width="160" height="64" rx="8" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="820" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">list list?</text>
    <text x="820" y="392" text-anchor="middle" font-size="9" fill="#6a6a6a">pair 右链到底</text>
    <text x="820" y="406" text-anchor="middle" font-size="9" fill="#6a6a6a">'(1 2 3)</text>
  </g>

  <!-- 底部说明：list 是 pair 的特例 -->
  <path d="M 780 416 C 800 446, 820 446, 820 416" fill="none" stroke="#d97757" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="820" y="466" text-anchor="middle" font-size="10" fill="#d97757">list = 一串 pair，尾巴收在 '()</text>

  <!-- 图例 / 总结 -->
  <text x="520" y="510" text-anchor="middle" font-size="12" fill="#1a1a1a">原子独立、拆不碎；复合把原子粘成 pair，pair 拉成 list。两者都是 S-表达式。</text>
</svg>

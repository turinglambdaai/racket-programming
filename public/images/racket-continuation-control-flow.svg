<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <title>延续：捕获"接下来要做的事"</title>
  <desc>call/cc 把"计算的剩余部分"打包成可调用的值。左图：在 (+ 1 (call/cc ...)) 处捕获延续（加 1、赋给 result），存进 saved-k。右图：日后调用 (saved-k 100)，时间旅行跳回捕获点，用 100 重跑那段未来。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
    <marker id="arrow-orange-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#d97757"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="540" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">延续 · 捕获"接下来要做的事"</text>
  <line x1="510" y1="54" x2="570" y2="54" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
  <text x="540" y="74" text-anchor="middle" font-size="12" fill="#6a6a6a">return 只回一层，延续能跳回任意一个被保存的未来</text>

  <!-- ===== 左：捕获时刻 ===== -->
  <text x="260" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">① 捕获时刻 · 程序正跑到这里</text>

  <!-- 计算流：自上而下 -->
  <g>
    <rect x="120" y="130" width="280" height="44" rx="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="260" y="158" text-anchor="middle" font-size="13" font-family="monospace" fill="#1a1a1a">(define result (+ 1 ...))</text>
  </g>
  <line x1="260" y1="174" x2="260" y2="200" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- call/cc 捕获点 -->
  <g>
    <rect x="120" y="206" width="280" height="56" rx="10" fill="#d97757" stroke="#4a4a4a" stroke-width="2"/>
    <text x="260" y="228" text-anchor="middle" font-size="10" fill="#f8f6f3">▼ 捕获点</text>
    <text x="260" y="250" text-anchor="middle" font-size="13" font-weight="700" font-family="monospace" fill="#f8f6f3">(call/cc (λ (k) (set! saved-k k) 10))</text>
  </g>

  <!-- "接下来要做的事" 被打包（虚线圈出） -->
  <rect x="100" y="278" width="320" height="120" rx="10" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="260" y="298" text-anchor="middle" font-size="10" font-weight="700" fill="#d97757">▼ 接下来要做的事（被捕获的延续）</text>
  <g>
    <rect x="130" y="308" width="260" height="34" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1"/>
    <text x="260" y="330" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a1a1a">把返回值 + 1</text>
  </g>
  <g>
    <rect x="130" y="350" width="260" height="34" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1"/>
    <text x="260" y="372" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a1a1a">绑定给 result</text>
  </g>

  <!-- 存进 saved-k -->
  <line x1="420" y1="338" x2="470" y2="338" stroke="#d97757" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <g>
    <rect x="475" y="318" width="60" height="40" rx="8" fill="#f4e4c1" stroke="#d97757" stroke-width="2"/>
    <text x="505" y="338" text-anchor="middle" font-size="9" fill="#6a6a6a">存进</text>
    <text x="505" y="352" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#1a1a1a">saved-k</text>
  </g>

  <!-- 当时的结果 -->
  <text x="260" y="424" text-anchor="middle" font-size="11" fill="#6a6a6a">call/cc 返回 10 → result = 11（正常往下走）</text>

  <!-- ===== 右：日后调用，时间旅行 ===== -->
  <text x="820" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">② 日后调用 · 时间旅行</text>

  <!-- 时间流逝提示 -->
  <text x="820" y="138" text-anchor="middle" font-size="11" fill="#6a6a6a">⋯ 程序早已跑完，干别的去了 ⋯</text>

  <!-- 调用 saved-k 100 -->
  <g>
    <rect x="660" y="206" width="320" height="56" rx="10" fill="#d97757" stroke="#4a4a4a" stroke-width="2"/>
    <text x="820" y="228" text-anchor="middle" font-size="10" fill="#f8f6f3">▼ 触发</text>
    <text x="820" y="250" text-anchor="middle" font-size="14" font-weight="700" font-family="monospace" fill="#f8f6f3">(saved-k 100)</text>
  </g>

  <!-- 跳回捕获点的大箭头（弧线，指向左图的捕获点） -->
  <path d="M 660 234 C 580 160, 420 160, 260 206" fill="none" stroke="#d97757" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>
  <rect x="410" y="156" width="140" height="28" rx="6" fill="#f8f6f3" stroke="#d97757" stroke-width="1.5"/>
  <text x="480" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#d97757">⏪ 跳回捕获点</text>

  <!-- 重跑那段未来 -->
  <rect x="640" y="278" width="320" height="120" rx="10" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="800" y="298" text-anchor="middle" font-size="10" font-weight="700" fill="#d97757">▼ 用 100 重跑那段未来</text>
  <g>
    <rect x="670" y="308" width="260" height="34" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1"/>
    <text x="800" y="330" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a1a1a">100 + 1 = 101</text>
  </g>
  <g>
    <rect x="670" y="350" width="260" height="34" rx="6" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1"/>
    <text x="800" y="372" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a1a1a">重新绑定给 result</text>
  </g>

  <text x="820" y="424" text-anchor="middle" font-size="11" fill="#6a6a6a">result 突然变成 101 —— 像从未离开过</text>

  <!-- ===== 底部洞察 ===== -->
  <g>
    <rect x="80" y="470" width="920" height="110" rx="10" fill="#f8f6f3" stroke="#4a4a4a" stroke-width="1" stroke-opacity="0.4"/>
    <text x="540" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">延续 = "从这一点往外的整条路"，被打包成了一个值</text>
    <text x="540" y="522" text-anchor="middle" font-size="11" fill="#1a1a1a">普通函数只能 call → execute → return，沿调用栈回一层。</text>
    <text x="540" y="542" text-anchor="middle" font-size="11" fill="#1a1a1a">延续没有这个限制 —— 它捕获的是整条剩余路径，可以跨过任意多层调用，也可以反复跳回。</text>
    <text x="540" y="566" text-anchor="middle" font-size="11" font-weight="700" fill="#d97757">非本地退出、生成器、协程、Web 会话 —— 底层都是同一件事：把延续存起来，以后跳回去。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' text-rendering="geometricPrecision">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97757"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1100" height="680" fill="#f8f6f3"/>

  <!-- =============== TOP GROUP: nested call (read inside-out) =============== -->
  <text x="550" y="62" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">嵌套调用<tspan fill="#d97757">（从内向外读）</tspan></text>

  <!-- concentric rings: translucent containers so the outward arrow can pierce them -->
  <!-- outer ring: number->string -->
  <rect x="315" y="115" width="330" height="230" rx="16" fill="#f4e4c1" fill-opacity="0.45" stroke="#4a4a4a" stroke-width="1.5"/>
  <!-- middle ring: add1 -->
  <rect x="365" y="155" width="230" height="150" rx="14" fill="#9dd4c7" fill-opacity="0.45" stroke="#4a4a4a" stroke-width="1.5"/>
  <!-- inner solid box: string->number -->
  <rect x="415" y="195" width="130" height="70" rx="10" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>

  <!-- function name labels (stacked, top of each ring) -->
  <text x="480" y="137" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a1a">number-&gt;string</text>
  <text x="480" y="175" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a1a">add1</text>
  <text x="480" y="217" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a1a">string-&gt;number</text>
  <!-- input value inside innermost box -->
  <text x="480" y="246" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">"41"</text>

  <!-- diagonal evaluation arrow: from inner box outward through the rings -->
  <line x1="545" y1="230" x2="698" y2="127" stroke="#d97757" stroke-width="2.25" marker-end="url(#arrow)"/>
  <!-- intermediate values along the arrow (value transforms at each layer) -->
  <text x="572" y="200" font-size="10" font-weight="700" text-anchor="middle" fill="#d97757">41</text>
  <text x="636" y="160" font-size="10" font-weight="700" text-anchor="middle" fill="#d97757">42</text>
  <!-- final result chip -->
  <rect x="700" y="110" width="64" height="36" rx="8" fill="#d97757"/>
  <text x="732" y="133" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">"42"</text>
  <!-- direction label -->
  <text x="590" y="258" font-size="10" font-weight="600" text-anchor="middle" fill="#6a6a6a">从内向外求值</text>

  <!-- =============== BOTTOM GROUP: pipeline (read left-to-right) =============== -->
  <text x="550" y="405" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">管道<tspan fill="#d97757">（从左向右读）</tspan></text>

  <!-- input chip -->
  <rect x="70" y="485" width="70" height="40" rx="10" fill="#d97757"/>
  <text x="105" y="510" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">"41"</text>

  <!-- function boxes (same colors as the nested rings above) -->
  <rect x="175" y="470" width="150" height="70" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="250" y="510" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a1a">string-&gt;number</text>

  <rect x="485" y="470" width="150" height="70" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="560" y="510" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a1a">add1</text>

  <rect x="795" y="470" width="150" height="70" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="870" y="510" font-size="11" font-weight="600" text-anchor="middle" fill="#1a1a1a">number-&gt;string</text>

  <!-- output chip -->
  <rect x="980" y="485" width="70" height="40" rx="10" fill="#d97757"/>
  <text x="1015" y="510" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">"42"</text>

  <!-- flow arrows (left to right) -->
  <line x1="140" y1="505" x2="175" y2="505" stroke="#d97757" stroke-width="2.25" marker-end="url(#arrow)"/>
  <line x1="325" y1="505" x2="485" y2="505" stroke="#d97757" stroke-width="2.25" marker-end="url(#arrow)"/>
  <line x1="635" y1="505" x2="795" y2="505" stroke="#d97757" stroke-width="2.25" marker-end="url(#arrow)"/>
  <line x1="945" y1="505" x2="980" y2="505" stroke="#d97757" stroke-width="2.25" marker-end="url(#arrow)"/>

  <!-- intermediate values carried by each arrow -->
  <text x="405" y="493" font-size="10" font-weight="700" text-anchor="middle" fill="#d97757">41</text>
  <text x="715" y="493" font-size="10" font-weight="700" text-anchor="middle" fill="#d97757">42</text>

  <!-- direction caption -->
  <text x="550" y="595" font-size="11" font-weight="600" text-anchor="middle" fill="#6a6a6a">从左向右流动</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <!-- background -->
  <rect x="0" y="0" width="960" height="580" fill="#f8f6f3"/>

  <!-- title -->
  <text x="480" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">表达式求值的抽象语法树（AST）</text>
  <text x="480" y="60" text-anchor="middle" font-size="11" fill="#6a6a6a">(add (num 1) (mul (num 2) (num 3)))</text>

  <!-- edges: parent bottom-center -> child top-center -->
  <g stroke="#4a4a4a" stroke-width="1.5" fill="none">
    <line x1="395" y1="174" x2="630" y2="286"/>
    <line x1="395" y1="174" x2="160" y2="446"/>
    <line x1="630" y1="334" x2="500" y2="446"/>
    <line x1="630" y1="334" x2="760" y2="446"/>
  </g>

  <!-- add (root, operation -> green) -->
  <rect x="340" y="126" width="110" height="48" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="395" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">add</text>
  <text x="395" y="164" text-anchor="middle" font-size="10" fill="#6a6a6a">+</text>

  <!-- mul (operation -> green) -->
  <rect x="575" y="286" width="110" height="48" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="630" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">mul</text>
  <text x="630" y="324" text-anchor="middle" font-size="10" fill="#6a6a6a">×</text>

  <!-- num 1 (leaf/value -> beige) -->
  <rect x="105" y="446" width="110" height="48" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="160" y="468" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">num</text>
  <text x="160" y="484" text-anchor="middle" font-size="10" fill="#6a6a6a">1</text>

  <!-- num 2 (leaf/value -> beige) -->
  <rect x="445" y="446" width="110" height="48" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="500" y="468" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">num</text>
  <text x="500" y="484" text-anchor="middle" font-size="10" fill="#6a6a6a">2</text>

  <!-- num 3 (leaf/value -> beige) -->
  <rect x="705" y="446" width="110" height="48" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="760" y="468" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">num</text>
  <text x="760" y="484" text-anchor="middle" font-size="10" fill="#6a6a6a">3</text>

  <!-- evaluation result badges (orange circles) -->
  <g>
    <circle cx="475" cy="150" r="16" fill="#d97757" stroke="#4a4a4a" stroke-width="1.2"/>
    <text x="475" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">7</text>
    <circle cx="710" cy="310" r="16" fill="#d97757" stroke="#4a4a4a" stroke-width="1.2"/>
    <text x="710" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
    <circle cx="240" cy="470" r="16" fill="#d97757" stroke="#4a4a4a" stroke-width="1.2"/>
    <text x="240" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <circle cx="580" cy="470" r="16" fill="#d97757" stroke="#4a4a4a" stroke-width="1.2"/>
    <text x="580" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <circle cx="840" cy="470" r="16" fill="#d97757" stroke="#4a4a4a" stroke-width="1.2"/>
    <text x="840" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  </g>

  <!-- caption -->
  <text x="480" y="545" text-anchor="middle" font-size="9" fill="#6a6a6a">橙色圆标为各节点求值结果，体现自底向上归约：先求叶节点 1、2、3，再算 mul = 6，最终 add = 7</text>
</svg>

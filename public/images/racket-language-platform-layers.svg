<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <rect width="900" height="480" fill="#f8f6f3"/>

  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Racket 语言平台：换 #lang 换语言，底层共用</text>

  <!-- Layer 1: #lang languages -->
  <text x="450" y="68" text-anchor="middle" font-size="10" fill="#6a6a6a">文件第一行 #lang 选一门语言</text>

  <rect x="60" y="80" width="150" height="60" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="135" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">racket</text>
  <text x="135" y="126" text-anchor="middle" font-size="8" fill="#6a6a6a">标准 Racket</text>

  <rect x="230" y="80" width="150" height="60" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="305" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">typed/racket</text>
  <text x="305" y="126" text-anchor="middle" font-size="8" fill="#6a6a6a">渐进式类型</text>

  <rect x="400" y="80" width="150" height="60" rx="8" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="475" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">scribble</text>
  <text x="475" y="126" text-anchor="middle" font-size="8" fill="#6a6a6a">文档语言</text>

  <rect x="570" y="80" width="150" height="60" rx="8" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5" opacity="0.85"/>
  <text x="645" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">自定义 #lang</text>
  <text x="645" y="126" text-anchor="middle" font-size="8" fill="#6a6a6a">你自己造的语言</text>

  <!-- arrow down to pipeline -->
  <line x1="135" y1="145" x2="135" y2="172" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="305" y1="145" x2="305" y2="172" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="475" y1="145" x2="475" y2="172" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="645" y1="145" x2="645" y2="172" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="135" y1="172" x2="645" y2="172" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="390" y1="172" x2="390" y2="190" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <!-- Layer 2: Reader-Expander-Runtime pipeline -->
  <text x="450" y="208" text-anchor="middle" font-size="10" fill="#6a6a6a">统一的三层管线</text>

  <rect x="80" y="220" width="220" height="75" rx="10" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="190" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Reader 读取层</text>
  <text x="190" y="268" text-anchor="middle" font-size="9" fill="#1a1a1a">文本 → S-表达式</text>
  <text x="190" y="284" text-anchor="middle" font-size="8" fill="#6a6a6a">自定义 reader 模块</text>

  <line x1="303" y1="258" x2="327" y2="258" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="220" width="220" height="75" rx="10" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="440" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Expander 展开层</text>
  <text x="440" y="268" text-anchor="middle" font-size="9" fill="#1a1a1a">跑宏 · 改写语法</text>
  <text x="440" y="284" text-anchor="middle" font-size="8" fill="#6a6a6a">define-syntax 在这里</text>

  <line x1="553" y1="258" x2="577" y2="258" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="220" width="220" height="75" rx="10" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="690" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Runtime 运行层</text>
  <text x="690" y="268" text-anchor="middle" font-size="9" fill="#1a1a1a">执行展开后的代码</text>
  <text x="690" y="284" text-anchor="middle" font-size="8" fill="#6a6a6a">命名空间 · provide/require</text>

  <!-- arrow down to runtime -->
  <line x1="390" y1="298" x2="390" y2="325" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Racket runtime -->
  <text x="450" y="343" text-anchor="middle" font-size="10" fill="#6a6a6a">底层共用</text>

  <rect x="150" y="355" width="600" height="75" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="450" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Racket 运行时（Racket CS / Chez Scheme）</text>
  <text x="450" y="403" text-anchor="middle" font-size="9" fill="#1a1a1a">垃圾回收 · Custodian · FFI · 并发</text>
  <text x="450" y="419" text-anchor="middle" font-size="8" fill="#6a6a6a">不管你选哪门 #lang，都跑在这同一套运行时上</text>

  <text x="450" y="458" text-anchor="middle" font-size="9" fill="#d97757" font-weight="600">别的语言：语法定死。Racket：语法可造——这就是"造语言的语言"。</text>
</svg>

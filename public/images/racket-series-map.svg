<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 440" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <title>Racket 入门系列 · 阅读地图</title>
  <desc>Racket 入门系列五大板块的递进路线图：基础 → 函数式 → 命令式 → 面向对象与 GUI → 计算模型与语言设计。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1480" height="440" fill="#f8f6f3"/>

  <!-- Title block -->
  <text x="740" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Racket 入门系列 · 阅读地图</text>
  <line x1="710" y1="68" x2="770" y2="68" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
  <text x="740" y="92" text-anchor="middle" font-size="13" fill="#6a6a6a">从写第一个表达式，到造一门语言 · 五大板块层层递进</text>

  <!-- Progression arrows (live in the gaps between cards) -->
  <g stroke="#d97757" stroke-width="2.5" stroke-linecap="round">
    <line x1="286" y1="240" x2="326" y2="240" marker-end="url(#arrow)"/>
    <line x1="576" y1="240" x2="616" y2="240" marker-end="url(#arrow)"/>
    <line x1="866" y1="240" x2="906" y2="240" marker-end="url(#arrow)"/>
    <line x1="1156" y1="240" x2="1196" y2="240" marker-end="url(#arrow)"/>
  </g>

  <!-- Card 1 · 基础 (gray) -->
  <g>
    <rect x="40" y="110" width="240" height="260" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="160" y="165" text-anchor="middle" font-size="10" font-weight="600" fill="#2a2a2a" letter-spacing="2">板块一</text>
    <text x="160" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">基础</text>
    <text x="160" y="241" text-anchor="middle" font-size="13" fill="#1a1a1a">「写点什么要知道什么」</text>
    <text x="160" y="273" text-anchor="middle" font-size="9" fill="#2a2a2a" letter-spacing="1.5">涵盖主题</text>
    <text x="160" y="297" text-anchor="middle" font-size="11" fill="#1a1a1a">环境 · 结构 · 数据</text>
    <text x="160" y="317" text-anchor="middle" font-size="11" fill="#1a1a1a">列表 · 结构体 · 函数</text>
  </g>

  <!-- Card 2 · 函数式 (green) -->
  <g>
    <rect x="330" y="110" width="240" height="260" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="450" y="165" text-anchor="middle" font-size="10" font-weight="600" fill="#2a2a2a" letter-spacing="2">板块二</text>
    <text x="450" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">函数式</text>
    <text x="450" y="241" text-anchor="middle" font-size="13" fill="#1a1a1a">「不动状态怎么算」</text>
    <text x="450" y="273" text-anchor="middle" font-size="9" fill="#2a2a2a" letter-spacing="1.5">涵盖主题</text>
    <text x="450" y="297" text-anchor="middle" font-size="11" fill="#1a1a1a">高阶函数 · 递归</text>
    <text x="450" y="317" text-anchor="middle" font-size="11" fill="#1a1a1a">组合 · λ演算</text>
  </g>

  <!-- Card 3 · 命令式 (beige) -->
  <g>
    <rect x="620" y="110" width="240" height="260" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="740" y="165" text-anchor="middle" font-size="10" font-weight="600" fill="#2a2a2a" letter-spacing="2">板块三</text>
    <text x="740" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">命令式</text>
    <text x="740" y="241" text-anchor="middle" font-size="13" fill="#1a1a1a">「状态怎么变」</text>
    <text x="740" y="273" text-anchor="middle" font-size="9" fill="#2a2a2a" letter-spacing="1.5">涵盖主题</text>
    <text x="740" y="297" text-anchor="middle" font-size="11" fill="#1a1a1a">异常 · 资源 · 状态机</text>
  </g>

  <!-- Card 4 · 面向对象与 GUI (blue) -->
  <g>
    <rect x="910" y="110" width="240" height="260" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="1030" y="165" text-anchor="middle" font-size="10" font-weight="600" fill="#2a2a2a" letter-spacing="2">板块四</text>
    <text x="1030" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">面向对象与 GUI</text>
    <text x="1030" y="241" text-anchor="middle" font-size="13" fill="#1a1a1a">「对象怎么组织、界面怎么搭」</text>
    <text x="1030" y="273" text-anchor="middle" font-size="9" fill="#2a2a2a" letter-spacing="1.5">涵盖主题</text>
    <text x="1030" y="297" text-anchor="middle" font-size="11" fill="#1a1a1a">class · 控件 · 事件</text>
  </g>

  <!-- Card 5 · 计算模型与语言设计 (orange) -->
  <g>
    <rect x="1200" y="110" width="240" height="260" rx="12" fill="#d97757" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="1320" y="165" text-anchor="middle" font-size="10" font-weight="600" fill="#2a2a2a" letter-spacing="2">板块五</text>
    <text x="1320" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">计算模型与语言设计</text>
    <text x="1320" y="241" text-anchor="middle" font-size="13" fill="#1a1a1a">「语言怎么造」</text>
    <text x="1320" y="273" text-anchor="middle" font-size="9" fill="#2a2a2a" letter-spacing="1.5">涵盖主题</text>
    <text x="1320" y="297" text-anchor="middle" font-size="11" fill="#1a1a1a">宏 · 延续 · DSL</text>
  </g>

  <!-- Footer hint -->
  <text x="740" y="408" text-anchor="middle" font-size="11" fill="#6a6a6a">由浅入深 · 层层递进 · 自左向右逐板块推进</text>
</svg>

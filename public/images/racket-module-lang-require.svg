<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family='"PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <title>#lang / require / provide：模块机制三件事</title>
  <desc>Racket 模块机制三个动作的关系：#lang 选语言（挑起全部语法的初始模块），require 在此基础上加载别的模块，provide 开窗口决定对外暴露什么。三者操作的是同一件东西——模块。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="540" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">#lang · require · provide：模块机制三件事</text>
  <line x1="510" y1="54" x2="570" y2="54" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
  <text x="540" y="74" text-anchor="middle" font-size="12" fill="#6a6a6a">三者操作的是同一件东西 —— 模块</text>

  <!-- ===== 中央：当前文件模块 ===== -->
  <g>
    <rect x="380" y="220" width="320" height="170" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="540" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a" letter-spacing="1">当前文件 · cake.rkt（一个模块）</text>
    <line x1="400" y1="256" x2="680" y2="256" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- #lang 行 -->
    <rect x="400" y="268" width="280" height="28" rx="4" fill="#d97757" stroke="#4a4a4a" stroke-width="1"/>
    <text x="540" y="286" text-anchor="middle" font-size="12" font-family="monospace" font-weight="700" fill="#f8f6f3">#lang racket</text>

    <!-- 模块体 -->
    <text x="400" y="316" font-size="11" font-family="monospace" fill="#1a1a1a">(provide print-cake)</text>
    <text x="400" y="336" font-size="11" font-family="monospace" fill="#1a1a1a">(define (print-cake n) ...)</text>
    <text x="400" y="356" font-size="11" font-family="monospace" fill="#6a6a6a">(define (helper ...) ...)</text>
    <text x="400" y="378" font-size="9" fill="#6a6a6a">↑ helper 没 provide，外部看不到</text>
  </g>

  <!-- ===== 左：#lang 选语言（初始模块流入） ===== -->
  <text x="160" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#d97757">#lang · 选语言</text>
  <text x="160" y="138" text-anchor="middle" font-size="10" fill="#6a6a6a">挑起全部语法的初始模块</text>

  <g>
    <rect x="60" y="160" width="200" height="110" rx="10" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="160" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a">语言模块 · racket</text>
    <line x1="80" y1="194" x2="240" y2="194" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="80" y="214" font-size="11" font-family="monospace" fill="#1a1a1a">define · lambda</text>
    <text x="80" y="232" font-size="11" font-family="monospace" fill="#1a1a1a">if · require</text>
    <text x="80" y="250" font-size="11" font-family="monospace" fill="#1a1a1a">provide · ...</text>
  </g>
  <text x="160" y="290" text-anchor="middle" font-size="10" fill="#6a6a6a">"语言"本身就是一个模块</text>

  <!-- 流入箭头：语言 → 当前模块 -->
  <path d="M 260 215 L 376 268" fill="none" stroke="#d97757" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="320" y="232" font-size="10" fill="#d97757">整套语法从这里来</text>

  <!-- ===== 右上：require 引模块（别的库流入） ===== -->
  <text x="920" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#d97757">require · 引模块</text>
  <text x="920" y="138" text-anchor="middle" font-size="10" fill="#6a6a6a">在当前语言基础上加载别的模块</text>

  <g>
    <rect x="820" y="160" width="200" height="60" rx="10" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="920" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a">库模块 · racket/list</text>
    <text x="920" y="204" text-anchor="middle" font-size="10" font-family="monospace" fill="#1a1a1a">remove-duplicates ...</text>
  </g>
  <g>
    <rect x="820" y="232" width="200" height="48" rx="10" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="920" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a">本地文件 · "utils.rkt"</text>
    <text x="920" y="270" text-anchor="middle" font-size="10" font-family="monospace" fill="#1a1a1a">按相对路径</text>
  </g>

  <!-- 流入箭头：库 → 当前模块 -->
  <path d="M 820 190 L 704 290" fill="none" stroke="#d97757" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M 820 256 L 704 320" fill="none" stroke="#d97757" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- ===== 下方：provide 开窗口（对外暴露） ===== -->
  <text x="540" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#d97757">provide · 开窗口</text>
  <text x="540" y="468" text-anchor="middle" font-size="10" fill="#6a6a6a">决定哪些绑定对外可见</text>

  <!-- 流出箭头：当前模块 → 外部使用者 -->
  <path d="M 540 390 L 540 478" fill="none" stroke="#d97757" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="560" y="438" font-size="10" fill="#d97757">只放出 provide 的</text>

  <g>
    <rect x="380" y="484" width="320" height="70" rx="10" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.5"/>
    <text x="540" y="506" text-anchor="middle" font-size="11" font-weight="600" fill="#2a2a2a">别的模块 / 外部使用者</text>
    <text x="540" y="528" text-anchor="middle" font-size="11" font-family="monospace" fill="#1a1a1a">(require "cake.rkt")</text>
    <text x="540" y="546" text-anchor="middle" font-size="10" fill="#6a6a6a">只能拿到 print-cake，拿不到 helper</text>
  </g>

  <!-- 左下角总结 -->
  <g>
    <rect x="60" y="430" width="280" height="124" rx="10" fill="#f8f6f3" stroke="#4a4a4a" stroke-width="1" stroke-opacity="0.4"/>
    <text x="80" y="454" font-size="12" font-weight="700" fill="#1a1a1a">一句话区分</text>
    <text x="80" y="476" font-size="11" fill="#1a1a1a"><tspan font-weight="700" fill="#d97757">#lang</tspan> 选语言 —— 文件第一行定调</text>
    <text x="80" y="496" font-size="11" fill="#1a1a1a"><tspan font-weight="700" fill="#d97757">require</tspan> 引模块 —— 不改语言，加载库</text>
    <text x="80" y="516" font-size="11" fill="#1a1a1a"><tspan font-weight="700" fill="#d97757">provide</tspan> 开窗口 —— 决定对外暴露啥</text>
    <text x="80" y="540" font-size="10" fill="#6a6a6a">三者操作同一件东西：模块</text>
  </g>
</svg>
